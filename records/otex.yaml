Description: >-
  OTEX (Ocean Thermal Energy eXchange) is a Python library for designing, simulating, and analyzing Ocean Thermal Energy Conversion (OTEC) power plants.
  It integrates with global oceanographic databases to enable site-specific techno-economic assessments anywhere in the tropical oceans.
