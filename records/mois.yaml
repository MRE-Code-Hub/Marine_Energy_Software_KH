# OPTIONAL: Major dependencies and add-on packages of the software package, e.g. for pre- and post-processing.
Dependencies:
  - LabView
# OPTIONAL: The description of the software package.
Description: >-
MOIS is a complete data acquisition system developed to support laboratory and field testing of
Marine Hydrokinetic (MHK) technologies. It is a deterministic real-time measurement system,
data logger, and device controller which provide extensive and reconfigurable measurement
capabilities. The hardware is housed in a waterproof enclosure and uses water tight connections
so it can be deployed in harsh ocean environments. The software was developed in the LabVIEW
programming language and runs on a LabVIEW real-time target.
