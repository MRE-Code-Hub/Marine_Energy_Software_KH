# OPTIONAL: The description of the software package.
Description: >-
This is an open source codebase that uses Multidisciplinary Design Optimization (MDO) to optimize an ocean wave energy converter (WEC). More
specifically, it is both a multidisciplinary model and a design optimization framework for two-body point absorber WECs. MDOcean uses the SQP
and pattern search algorithms to find the geometry, PTO, and structural design which optimizes the levelized cost of energy, capital cost,
and average power of the Reference Model 3 (RM3) WEC, using a fast simplified frequency domain WEC model.
